# Non-pip tools that xdmod's own tooling needs (D19). pip packages: requirements.txt.
# Format: xdmod/curatrix/README.md ("tools.yaml"). Installed by `curatrix bootstrap` /
# `curatrix update` into <ws>/.venv/<location> (or .xdmod/<...>), every download checked against its
# sha256, a git tool against its commit.
# `curatrix doctor` fails when an installed tool or a system tool has another version.
tools:
  - name: jdk
    version: "21.0.13+9"
    kind: tarball
    url: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz
    sha256: d7f5d5cf865a2902b70ff549b97586a7d3f234e016f041ab447ea740c7d66d1c
    location: opt/jdk
    env: {JAVA_HOME: "{location}"}

  - name: sysml-pilot
    # SysML v2 Pilot Implementation 0.63.1 (2026-09.1), as the conda package jupyter-sysml-kernel.
    # Holds jupyter-sysml-kernel-0.63.1-all.jar and sysml.library/ (D65).
    version: "0.63.1"
    kind: conda
    url: https://conda.anaconda.org/conda-forge/noarch/jupyter-sysml-kernel-0.63.1-pyhd8ed1ab_0.conda
    sha256: 8da665d2b2131dcfbde62d32926864d0d03a62393ffdf4598efa64e0bc4b2251
    subdir: share/jupyter/kernels/sysml
    location: opt/sysml-pilot

  # node packages share one prefix (opt/node). npm checks their integrity itself (no sha256).
  - name: elkjs
    version: "0.12.1"
    kind: npm
    location: opt/node
  - name: puppeteer-core
    version: "25.17.0"
    kind: npm
    location: opt/node

  - name: drawio-viewer
    # drawio's viewer (Apache-2.0), used to render .drawio.svg pictures in headless Firefox.
    version: "32.6.1"
    kind: file
    url: https://cdn.jsdelivr.net/gh/jgraph/drawio@v32.6.1/src/main/webapp/js/viewer-static.min.js
    sha256: 0c12ccf10dcaf0d0ef40ca60a5bc881ba27b57e076797ee39bce46602371f769
    location: opt/drawio-viewer/viewer-static.min.js

  - name: gh
    # GitHub CLI (PRs, issues, bump bot). 2.103.3 rather than 2.104.0 (too new at the time).
    version: "2.103.3"
    kind: tarball
    url: https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz
    sha256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
    location: opt/gh
    links: {gh: bin/gh}

  - name: stepup
    # KiCad StepUp (easyw/kicadStepUpMod), the co-design push FreeCAD -> KiCad (XD-ADR-0134). Pinned
    # by commit (no release tags); version = ___ver___ of kicadStepUptools.py at that commit. Not a
    # FreeCAD addon here: not in FreeCAD's Mod/, put on sys.path by our scripts. Licence gap (owner
    # decision Q4, xdmod#69): AGPL-3.0 is only claimed (README, package.xml names a LICENSE file
    # that the repo does not have). We call it in its own FreeCAD process and never import it into
    # curatrix or copy its code into our repos.
    version: "13.1.7"
    kind: git
    url: https://github.com/easyw/kicadStepUpMod
    commit: 3db98be23aae40413eab041f19de5ab2e168157e
    location: .xdmod/stepup/kicadStepUpMod
    licence: "AGPL-3.0 claimed, no LICENSE file (gap); called, never imported"
    env: {XD_STEPUP: "{location}", XD_STEPUP_HOME: "{state}/stepup/home"}
    roles: [ee, ee3d, me, integration, full]

  - name: freecad-mcp-addon
    # neka-nat/freecad-mcp (MIT): the FreeCAD addon with the XML-RPC server (127.0.0.1:9875) that the
    # MCP server freecad-mcp (requirements.txt, same version; doctor compares) talks to
    # (xdmod#69 finding 18, owner decision Q1; build/research-freecad-mcp/report.md). Into the
    # workspace FreeCAD's Mod/ (XDG_DATA_HOME of `curatrix launch freecad`), never ~/.local/share.
    # The port opens only with `curatrix launch freecad --mcp`; token and settings: curatrix update.
    # GitHub archive hashes are not guaranteed stable: a change fails the update loudly; fallback:
    # kind git with the tag commit 246f608d5de49089aadc41d2d91cfce2ad8a44cd.
    version: "0.1.32"
    kind: tarball
    url: https://github.com/neka-nat/freecad-mcp/archive/refs/tags/v0.1.32.tar.gz
    sha256: c28c9bc0001cd1f791b206b21a207f5da871de21e92885f65b42cf63863e7758
    strip: 1
    subdir: addon/FreeCADMCP
    location: .xdmod/freecad/data/FreeCAD/v1-1/Mod/FreeCADMCP
    licence: MIT
    roles: [ee, ee3d, me, integration, full]

  - name: kicad-mcp
    # KiCad MCP server: mixelpixx/KiCAD-MCP-Server v2.9.0 (MIT, upstream 9dd467c2) through the fork
    # tiacsys/KiCAD-MCP-Server, branch xd/main = the tag + the configurable-path patches
    # (KICAD_MCP_HOME/LOG_DIR, KICAD_DOCUMENTS_HOME/CONFIG_HOME, KICAD_MCP_STRICT_PATHS,
    # KICAD_API_SOCKET/TOKEN), offered upstream (xdmod#69 finding 19, owner decisions Q1, Q3;
    # build/research-kicad-mcp/report.md). The release asset holds the built dist/, production
    # node_modules and requirements.lock.txt (hashed, without pymupdf, which is AGPL-3.0).
    # Started by `curatrix mcp-server kicad` (.mcp.json server `kicad`); its Python worker runs in its
    # own venv with the system KiCad's SWIG pcbnew linked in.
    # PREVIEW PIN: the tag v2.9.0-xd.1 is not made yet (fork PRs #3-#5 under review); this sha256
    # is of a local build of the patch stack (c4d3b0d). Replace it with SHA256SUMS of the release.
    version: "2.9.0-xd.1"
    kind: tarball
    url: https://github.com/tiacsys/KiCAD-MCP-Server/releases/download/v2.9.0-xd.1/kicad-mcp-server-2.9.0-xd.1.tar.gz
    sha256: 49a14494497c9c518ac8e86f7a7be6157f1b64c3f5bea31b3196e2c1f1e91d00
    strip: 1
    location: opt/kicad-mcp
    licence: MIT
    python_venv:
      requirements: requirements.lock.txt
      system_modules: [pcbnew, _pcbnew]
    roles: [ee, ee3d, me, integration, full]

# Tools used from the machine (D19). Exact pins only for tools that shape committed output
# (views: firefox; the tools above); minimum versions for the rest, so that a rolling distro's
# patch release does not break `curatrix doctor` (task 5.5, P4-12). The minimums are the
# versions of the CI runner (ubuntu-24.04), so CI and the reference machine both pass.
system:
  - {name: python3, version: "3.14.*", regex: 'Python (\d+\.\d+\.\d+)'}
  - {name: git, version: ">=2.43"}
  - {name: cmake, version: ">=3.28"}
  - {name: ninja, version: ">=1.11"}
  - {name: node, version: ">=22", regex: 'v(\d+\.\d+\.\d+)'}                     # runs elkjs, which is pinned
  - {name: npm, version: ">=10"}
  - {name: firefox, version: "160.*", regex: 'Firefox (\d+\.\d+(?:\.\d+)?)'}   # headless SVG export of views
  - {name: dot, version: ">=2.43", cmd: [dot, -V]}                               # needflow (graphviz): HTML only, never committed
  - {name: curl, version: "any"}
  - {name: tar, version: "any"}
  - {name: zstd, version: "any", cmd: [zstd, --version], regex: 'v(\d+\.\d+\.\d+)'}
  - {name: drawio, version: "31.7.0", optional: true}                            # D97, people only
  # Both CAD tools for both domain roles (XD-ADR-0141): EE imports board models into FreeCAD,
  # ME pushes board geometry into the KiCad files and re-saves them with KiCad.
  - {name: kicad-cli, version: "10.0.8", optional: true, roles: [ee, ee3d, me, integration, full]}
  - {name: FreeCADCmd, version: "1.1.4", optional: true, roles: [ee, ee3d, me, integration, full], regex: 'FreeCAD (\d+\.\d+\.\d+)'}
  # Optional local renderer of `curatrix cam` for ME assemblies (owner decision 2026-11-17). Not
  # pinnable (a distribution package, curatrix installs nothing): the version it was tried with;
  # missing = a note, another version = a warning, never a FAIL. Called only through curatrix or
  # the .venv/bin shim (--factory-startup, user paths under .xdmod/blender/).
  - {name: blender, version: "5.2.3", optional: true, pinned: false, roles: [me, integration, full], regex: 'Blender (\d+\.\d+\.\d+)'}
