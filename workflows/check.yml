# Template: copy to <repo>/.github/workflows/check.yml and set `repo`, `role` and `manifest`.
# It calls xdmod's reusable workflow (xdmod/.github/workflows/curatrix-check.yml). GitHub only runs
# reusable workflows from .github/workflows/, so that is where the real workflow lives; this
# folder holds the thin callers (repo-layouts.md §1).
name: check
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    uses: tiacsys/xdmod/.github/workflows/curatrix-check.yml@main
    with:
      repo: myproj-ee          # this repo's west project name
      role: ee                 # the syseng repo and xdmod: integration (checks every downstream repo too)
      manifest: myorg/myproj-manifest   # required: the project's manifest repo (owner/name)
