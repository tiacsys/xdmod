# ================================================================== schema rules (§3 footnotes, §4)
# --- footnote 4: raised_by is required for category need / objective
[[needs.schema_definitions.schemas]]
id = "XD-S-need-raised-by"
severity = "violation"
select = { properties = { type = { const = "sys-need" }, category = { enum = ["need", "objective"] } }, required = ["category"] }
validate.local = { properties = { raised_by = { minItems = 1 } }, required = ["raised_by"] }

# --- every SYS-NEED has a category
[[needs.schema_definitions.schemas]]
id = "XD-S-need-category"
severity = "violation"
select = { properties = { type = { const = "sys-need" } } }
validate.local = { required = ["category"] }

# --- addresses between needs points at the problem statement (D81)
[[needs.schema_definitions.schemas]]
id = "XD-S-need-addresses-problem"
severity = "violation"
select = { properties = { type = { const = "sys-need" } } }
validate.network.addresses = { items = { local = { properties = { category = { const = "problem" } }, required = ["category"] } } }

# --- footnote 1: a domain requirement refines something, or is derived with a rationale
[[needs.schema_definitions.schemas]]
id = "XD-S-domain-req-upstream"
severity = "violation"
# sphinx-needs 9.2 schemas have no "any of", so "A or B" is written as "select: A empty; require B".
select = { properties = { type = { enum = ["sw-req", "ee-req", "me-req"] }, refines = { maxItems = 0 } } }
validate.local = { properties = { derived = { const = true }, rationale = { minLength = 1 } }, required = ["derived", "rationale"] }

# --- SYS-EL has a layer (D85, D129)
[[needs.schema_definitions.schemas]]
id = "XD-S-el-layer"
severity = "violation"
select = { properties = { type = { const = "sys-el" } } }
validate.local = { required = ["layer"] }

# --- a functional SYS-EL realizes a use case (D85)
[[needs.schema_definitions.schemas]]
id = "XD-S-el-functional-realizes-uc"
severity = "violation"
select = { properties = { type = { const = "sys-el" }, layer = { const = "functional" } }, required = ["layer"] }
validate.local = { properties = { realizes = { minItems = 1 } }, required = ["realizes"] }

# --- R3 orphans: product-layer SYS-EL and domain design elements realize or satisfy something
[[needs.schema_definitions.schemas]]
id = "XD-S-R3-no-orphan-product-el"
severity = "violation"
select = { properties = { type = { const = "sys-el" }, layer = { const = "product" }, status = { enum = ["draft", "valid"] }, realizes = { maxItems = 0 } }, required = ["layer"] }
validate.local = { properties = { satisfies = { minItems = 1 } }, required = ["satisfies"] }

[[needs.schema_definitions.schemas]]
id = "XD-S-R3-no-orphan-design"
severity = "violation"
select = { properties = { type = { enum = ["sw-arch", "ee-pcba", "ee-cmp", "me-asm", "me-part"] }, status = { enum = ["draft", "valid"] }, realizes = { maxItems = 0 } } }
validate.local = { properties = { satisfies = { minItems = 1 } }, required = ["satisfies"] }

# --- R5: a HIL result carries the firmware hash and the pinned SHAs (D57, D60)
[[needs.schema_definitions.schemas]]
id = "XD-S-R5-hil-evidence"
severity = "violation"
select = { properties = { type = { const = "tr" }, method = { const = "hil" } }, required = ["method"] }
validate.local = { properties = { shas = { minItems = 1 } }, required = ["firmware_sha256", "shas"] }

# --- R4: links to retired needs are NOT a schema rule here, on purpose (D75 grace period).
# sphinx-needs 9.2 reports every failed network rule as a violation, whatever severity the rule
# names (the child findings of validate.network get the default severity), so a strict build
# would fail at once. `curatrix check` implements R4 instead (CK-B3): a warning on main and in
# PRs, an error at the baseline stage.
