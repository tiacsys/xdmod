# XDMOD shared needs configuration (trace-model.md §2-§5, id-scheme.md).
#
# Every document of every repo that uses XDMOD loads this file (zdocs: ZDOCS_NEEDS_CONFIG,
# set by xdmod/cmake/xdmod-docs.cmake; plain Sphinx: needs_from_toml). Every document must
# know every type, including downstream ones, because external needs are imported everywhere.
#
# Rules this file follows:
# - A link type is declared ONLY on the need type that holds it, the concrete side (D5, D36,
#   D64h). There is no global link table. A link written from the wrong side fails the build
#   (needs.undeclared_for_type); a link to an unknown ID fails (needs.link_outgoing); a link
#   to a wrong target type fails (target_types).
# - "Min" from the link table is `schema = { minItems = 1 }`. Conditional minimums (only for
#   some categories / layers) are schema rules at the end of this file.
# - Directive name = ID kind in lower case (`sys-req` <-> `SYS-REQ-0012`), prefix = kind + "-".
# - Links to retired needs (R4, D75) do NOT fail a strict build: there is deliberately no
#   schema rule for them (see the end of this file). `curatrix check` (CK-B3) reports them
#   as a warning and fails only at the baseline stage.
# - The conf helper (xdmod/sphinx/xdmod_conf.py) suppresses `needs.type_near_name`: the link
#   type `configures` and the field `configs` are both fixed by the trace model.
# Requires sphinx-needs 9.2.

[needs]
# id-scheme.md §2, plus usage IDs <ID>.<n> (D128) and the IDs sphinx-test-reports generates
# (TF_/TS_/TC_ hashes, lowercase deterministic ids; id-scheme.md §6.5).
id_regex = '^(((SYS|SW|EE|ME|INT|XD|PRJ)-[A-Z]{2,5}-[0-9]{4,}(\.[0-9]+)?)|(TR-(SYS|SW|EE|ME|INT)-[A-Z]{2,5}-[0-9]{4,}-[0-9a-f]{8})|((TF|TS|TC)_[A-Za-z0-9_]+)|((testfile|testsuite|testcase|tr)_[A-Za-z0-9_]+))$'
id_required = true
reproducible_json = true
# Without this, needflow uses PlantUML (not installed) and silently renders an error box.
flow_engine = "graphviz"

# ------------------------------------------------------------------ fields shared by all types (§5)
[needs.fields.status]
description = "draft | valid | retired (D64e, D130). draft: structure checks only, no coverage."
schema = { type = "string", enum = ["draft", "valid", "retired"] }

[needs.fields.source_file]
description = "Generated needs: source path relative to the repo."
schema = { type = "string" }

[needs.fields.legacy_id]
description = "The old D-number of a decision (D120)."
schema = { type = "string" }

[needs.fields.instances]
description = "Usages of a definition need (D128), e.g. leader.joint1."
schema = { type = "array", items = { type = "string" } }

[needs.fields.configs]
description = "SYS-CFG IDs the element belongs to; empty = all (D103)."
schema = { type = "array", items = { type = "string", pattern = '^SYS-CFG-[0-9]{4,}$' } }

[needs.fields.qualified_name]
description = "SysML qualified name of the element (generated needs)."
schema = { type = "string" }

[needs.fields.sysml_kind]
description = "SysML metaclass of the element (generated needs)."
schema = { type = "string" }

# ------------------------------------------------------------------ requirement fields (D83, D103, D104)
[needs.fields.category]
description = "SYS-NEED: problem | objective | need. Requirements: functional | performance | interface | constraint."
schema = { type = "string", enum = ["problem", "objective", "need", "functional", "performance", "interface", "constraint"] }

[needs.fields.ears]
description = "EARS pattern of the sentence (D12, D45)."
schema = { type = "string", enum = ["ubiquitous", "event", "state", "optional", "unwanted", "complex"] }

[needs.fields.quantity]
schema = { type = "string" }
[needs.fields.unit]
schema = { type = "string" }
[needs.fields.min]
schema = { type = "number" }
[needs.fields.max]
schema = { type = "number" }
[needs.fields.nominal]
schema = { type = "number" }

[needs.fields.verification_method]
schema = { type = "string", enum = ["test", "analysis", "inspection", "demonstration"] }

[needs.fields.verification_scope]
description = "logical: evidence from any configuration counts; config: per configuration (D104)."
schema = { type = "string", enum = ["logical", "config"] }

[needs.fields.where]
description = "Feature condition, e.g. SYS-FEAT-0002 (D103)."
schema = { type = "string" }

[needs.fields.derived]
description = "Domain requirement without an upstream link (needs a rationale)."
schema = { type = "boolean" }

[needs.fields.rationale]
schema = { type = "string" }

# ------------------------------------------------------------------ model element fields (D85, D129)
[needs.fields.layer]
description = "SYS-EL only: context | functional | logical | product."
schema = { type = "string", enum = ["context", "functional", "logical", "product"] }

# ------------------------------------------------------------------ verification result fields (D103, D131)
[needs.fields.config]
description = "The single SYS-CFG a test run was made on."
schema = { type = "string", pattern = '^SYS-CFG-[0-9]{4,}$' }
[needs.fields.method]
description = "How the evidence was produced (D131)."
schema = { type = "string", enum = ["test", "hil", "analysis", "inspection", "demonstration"] }
[needs.fields.firmware_sha256]
schema = { type = "string", pattern = '^[0-9a-f]{64}$' }
[needs.fields.shas]
description = "Pinned repo SHAs of the run: repo=sha entries (R5)."
schema = { type = "array", items = { type = "string", pattern = '^[A-Za-z0-9_.-]+=[0-9a-f]{7,40}$' } }
[needs.fields.reviewer]
schema = { type = "string" }
[needs.fields.verdict]
schema = { type = "string", enum = ["passed", "failed", "skipped", "error"] }

