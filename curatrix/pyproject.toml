[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curatrix"
version = "0.1.0"
description = "XDMOD workspace command layer: checks, generators, IDs, views, launchers (D98)"
license = "Apache-2.0"
requires-python = ">=3.12"
# Only PyYAML at runtime; everything else is the standard library. Sphinx, sphinx-needs and
# west come from the workspace requirements (xdmod/requirements.txt).
dependencies = ["PyYAML>=6"]

[project.scripts]
curatrix = "curatrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curatrix = ["*.yaml", "data/*", "views/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
