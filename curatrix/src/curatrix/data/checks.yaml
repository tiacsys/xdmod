# Check catalogue (D121): the need side of curatrix's built-in checks (checks.BUILTIN).
# Each check is an XD-CHECK need in the XDMOD manual (reference/checks, generated by the
# Sphinx directive `xd-check-needs`), and it `enforces` one or more method rules (XD-RULE).
# `need` is issued from xdmod's ledger (`curatrix ids fix xdmod`); never change or reuse it.
# Name, config section and levels per stage stay in checks.BUILTIN; a test keeps both in step.
# A check that is removed keeps its entry with `retired: <date and reason>` (its need is retired, D130).
checks:
  CK-A6:
    need: XD-CHECK-0001
    enforces: [XD-RULE-0034, XD-RULE-0002, XD-RULE-0010, XD-RULE-0012]
    description: "Builds every document of the repo's registry with zdocs in strict mode. The sphinx-needs schema in the shared needs configuration checks each need: link side, link targets, required links, field values and ID pattern."
  CK-A7:
    need: XD-CHECK-0060
    enforces: [XD-RULE-0067]
    description: "Plain Python on the docs registry and the folders below docs/: every own registry entry has its document folder, every document folder is in the registry, per-deliverable documents sit in their sub-folder (pcbas/, assemblies/, firmware/), and a repo with harnesses has one harnesses document and no harness-<cable> documents."
  CK-A1:
    need: XD-CHECK-0002
    enforces: [XD-RULE-0002]
    description: "Reads every needs.json of the docs build (own and imported needs) and reports links to IDs that exist nowhere. sphinx-needs skips imported needs, so this own check covers them."
  CK-A3:
    need: XD-CHECK-0003
    enforces: [XD-RULE-0015]
    description: "Every need ID matches the ID scheme, and its kind matches the need type."
  CK-A4:
    need: XD-CHECK-0004
    retired: "2026-11-17: the sphinx-needs schema of needs_config.toml enforces R3 in the build of the repo that owns the need (task 5.2, P4-9)"
    enforces: [XD-RULE-0010]
    description: "Product-layer system elements and domain design elements have a realizes or satisfies link."
  CK-A5:
    need: XD-CHECK-0005
    retired: "2026-11-17: the sphinx-needs schema of needs_config.toml enforces R5 in the build of the repo that owns the need (task 5.2, P4-9)"
    enforces: [XD-RULE-0012]
    description: "Test results of HIL runs carry firmware_sha256 and the SHAs of the pinned repos."
  CK-B1:
    need: XD-CHECK-0006
    enforces: [XD-RULE-0008]
    description: "Every system requirement is refined by a domain requirement or satisfied by a model element (draft sources don't count)."
  CK-B2:
    need: XD-CHECK-0007
    enforces: [XD-RULE-0009]
    description: "Every requirement has a verifies link pointing at it. Not yet per configuration."
  CK-B3:
    need: XD-CHECK-0008
    enforces: [XD-RULE-0011]
    description: "Links to retired needs: a warning until the baseline stage, where it is an error."
  CK-B4:
    need: XD-CHECK-0009
    enforces: [XD-RULE-0021, XD-RULE-0022, XD-RULE-0023, XD-RULE-0024, XD-RULE-0025, XD-RULE-0026, XD-RULE-0027]
    description: "Runs the variant rules on the model JSON (feature model, product models and bindings)."
  CK-B8:
    need: XD-CHECK-0034
    enforces: [XD-RULE-0048]
    description: "Variants across levels, against the published system model: exactly one domain variant per configuration and usage; pairs are built per realized system def; the variant serves only such pairs and every dependency names a configuration and a usage; every named variant (also an unused one) exists in the KiCad project or FreeCAD configuration table; an upstream model without configurations is a finding; Zephyr board variants map to board variants by name; at most two variants per board or assembly. The computed table \"configuration -> variant per usage\" is in the check's log."
  CK-B5:
    need: XD-CHECK-0010
    enforces: [XD-RULE-0016]
    description: "No ID appears in two documents."
  CK-B6:
    need: XD-CHECK-0011
    enforces: [XD-RULE-0013]
    description: "Reports test results whose recorded SHAs don't match the current pins (stale evidence)."
  CK-B7:
    need: XD-CHECK-0012
    enforces: [XD-RULE-0020]
    description: "Reports tombstones in generated/retired-needs.json: generated needs that were deleted without being retired first."
  CK-C1:
    need: XD-CHECK-0013
    enforces: [XD-RULE-0017]
    description: "No placeholder IDs (<KIND>-NEW-<tag>) in the repo's sources."
  CK-C2:
    need: XD-CHECK-0014
    enforces: [XD-RULE-0018]
    description: "Every ID of a kind the repo owns appears in the repo's ledger ids.yaml."
  CK-D1:
    need: XD-CHECK-0015
    enforces: [XD-RULE-0033]
    description: "The committed SysML requirement stubs match the needs of the requirement documents."
  CK-E1:
    need: XD-CHECK-0016
    enforces: [XD-RULE-0035]
    description: "The OMG Pilot Implementation parses the model with 0 errors."
  CK-D2:
    need: XD-CHECK-0017
    enforces: [XD-RULE-0033]
    description: "The committed model.json and model-needs.json match a fresh export of the model."
  CK-D3:
    need: XD-CHECK-0018
    enforces: [XD-RULE-0033, XD-RULE-0039]
    description: "The committed views match the model in content (not geometry), are uncompressed, and their pictures are fresh."
  CK-D4:
    need: XD-CHECK-0019
    enforces: [XD-RULE-0033]
    description: "The committed cad-needs.json matches the trace fields in the KiCad and FreeCAD files (plain Python, no CAD tools)."
  CK-D6:
    need: XD-CHECK-0032
    enforces: [XD-RULE-0033]
    description: "The committed code-needs.json matches the code: code units from the @xdid Doxygen blocks, test cases from the comments above ZTEST (plain Python)."
  CK-D5:
    need: XD-CHECK-0020
    enforces: [XD-RULE-0041]
    description: "generated/provenance.json records the tool versions that made the generated files, and they match tools.yaml."
  CK-E2:
    need: XD-CHECK-0021
    enforces: [XD-RULE-0036]
    description: "Each of min, max and nominal of a requirement occurs as a number in its sentence (in any order and format: thousands separators, decimals, a ± b), and the unit occurs once, as symbol or name. A warning until it has run on the real requirements (task 5.4)."
  CK-E3:
    need: XD-CHECK-0022
    enforces: [XD-RULE-0037]
    description: "The sentence of a requirement matches its EARS pattern and uses \"shall\"."
  CK-E4:
    need: XD-CHECK-0033
    enforces: [XD-RULE-0047]
    description: "A domain model conforms to its upstream model: every port a domain def inherits from an upstream def is redefined in the chain by a port whose def specializes the inherited one (also at signal level), inherited name clashes are solved, and every specialization between two IDs has a link type."
  CK-F6:
    need: XD-CHECK-0035
    enforces: [XD-RULE-0049]
    description: "KiCad projects are found by their .kicad_pro (cad.projects); one project per folder, named like the folder, with its root sheet of the same name; no KiCad project file outside these folders."
  CK-F7:
    need: XD-CHECK-0036
    enforces: [XD-RULE-0049]
    description: "Each board def of the EE model has exactly one pcba/ project whose TraceID is its EE-PCBA ID, in the folder named after the def; every pcba/ project names one board def; external parts have no project; no link variables on projects. Each cable def (XdDomain::Cable, EE-HAR) has exactly one harness/<name>/<name>.yml whose metadata TraceID is its EE-HAR, in the folder named after the def, and back (cad.harnesses)."
  CK-F3:
    need: XD-CHECK-0048
    enforces: [XD-RULE-0057]
    description: "The aliases <usage>_<attribute> in the spreadsheet Params of assemblies/<name>/<name>-skeleton.FCStd equal the attribute values of the assembly def's part and port usages in the ME model, and each LCS with a Port property sits where the port's x, y, z, yaw, pitch, roll say; tolerance per kind (lengths 0.001 mm, angles 0.001 deg) or @XdDomain::ModelMatchTolerance on the attribute (in its own unit; model-to-CAD agreement, not a part tolerance); at most ten parameters; no alias the model does not know."
  CK-F14:
    need: XD-CHECK-0046
    enforces: [XD-RULE-0055]
    description: "Each assembly def of the ME model has exactly one FreeCAD document with an object whose TraceID is its ME-ASM ID, named after the def; a top-level assembly is the folder assemblies/<name>/ with <name>.FCStd and <name>-skeleton.FCStd; no document refers to a top document; no link fields next to the TraceID."
  CK-F15:
    need: XD-CHECK-0047
    enforces: [XD-RULE-0056]
    description: "In the document of an assembly def, the FreeCAD links per part or sub-assembly (by the TraceID of the link target) equal its usages: the ME model's usages (with multiplicity) and the system model's usages in the blocks the assembly realizes; per configuration (Configs on links); links to the skeleton and to board models of the board library (cad.board_library) are not counted."
  CK-D7:
    need: XD-CHECK-0037
    enforces: [XD-RULE-0050]
    description: "The committed generated/<project>.connectors.json equals the connector tables read from the KiCad schematic in plain Python (pins, pin names, nets, the port fields portName, portType, portTypeID); no file of a removed project."
  CK-D8:
    need: XD-CHECK-0038
    enforces: [XD-RULE-0050]
    description: "The plain-Python connector extraction equals KiCad's XML netlist (kicad-cli sch export netlist --format kicadxml) on every project: portName, portType, portTypeID, pin numbers, pin names (from libparts) and nets (local, needs KiCad)."
  CK-F1:
    need: XD-CHECK-0039
    enforces: [XD-RULE-0050]
    description: "Every connector of a pcba/ project has a portName field (- = none) naming a port usage of the board def, with portType = the name of that port's def and portTypeID = its EE-PORT ID; the old Port field is a finding; each port of the board def is named by exactly one connector; pin numbers and net names equal the pin map of the EE model. Each harness end (a WireViz connector) names the end port of the cable def the same way (lines `portName:`, `portType:`, `portTypeID:` in its notes); its pins and pin labels contain that pin map (pin numbers and net names; both ends use the same net names, also an external part); every conductor, loops included, joins pins of one net and no wired pin is outside the pin map; the ends are the ports of the cable def (also ports of external parts)."
  CK-F22:
    need: XD-CHECK-0059
    enforces: [XD-RULE-0066]
    description: "Port usages of the parts of the EE model (boards, cables, external parts) have functional lowerCamelCase names, not reference designators (a KiCad reference prefix and digits, such as j1, p3, x2; interface names such as i2c0, spi1, can0 pass); every part of a pcba/ project whose portName names a port has an X designator (X1, X2, ...). A warning (owner decisions Q10, Q11)."
  CK-F4a:
    need: XD-CHECK-0040
    enforces: [XD-RULE-0051]
    description: "KiCad ERC (kicad-cli sch erc --format json --severity-all) of every project: each error is excluded in KiCad or matched by an accepted.yaml entry, accepted by a human commit with Accepted-by (local, needs KiCad); warnings only listed."
  CK-F4b:
    need: XD-CHECK-0041
    enforces: [XD-RULE-0051]
    description: "KiCad DRC with schematic parity (kicad-cli pcb drc) of every pcba/ board, same rule as CK-F4a; the unrouted nets accepted in one entry (local, needs KiCad)."
  CK-F8:
    need: XD-CHECK-0042
    enforces: [XD-RULE-0052]
    description: "The ERC and DRC severities and the ERC pin conflict matrix of every project (.kicad_pro, custom rules in .kicad_dru) equal the curatrix new pcba template; a difference needs an accepted entry."
  CK-F9:
    need: XD-CHECK-0043
    enforces: [XD-RULE-0051]
    description: "accepted.yaml entries (pcba/<name>/ and proto/<name>/, and assemblies/<name>/ in an ME repo) are well formed (check, rule, items as designators, part names or all, reason); each entry and each KiCad exclusion is accepted (newest commit with Accepted-by, no agent mark, nothing else changed) or reported as a proposal."
  CK-F4c:
    need: XD-CHECK-0052
    enforces: [XD-RULE-0061]
    description: "Every FreeCAD document of cad.freecad recomputes in FreeCADCmd (each assembly's skeleton, then its top document, then the others; nothing saved) without an invalid object; the exploded-view objects of the Assembly workbench, whose proxy cannot load in FreeCADCmd, are left out. An error passes only when accepted in assemblies/<name>/accepted.yaml (rule recompute, items <document stem>#<object>) by a human commit with Accepted-by (local, needs FreeCAD)."
  CK-F16:
    need: XD-CHECK-0053
    enforces: [XD-RULE-0061]
    description: "Every object with an ME-PART TraceID has a valid shape of solids: Part check valid, at least one solid, every solid valid with a volume, no face or shell outside the solids; else a finding unless accepted (rule solid) (local, needs FreeCAD)."
  CK-F17:
    need: XD-CHECK-0054
    enforces: [XD-RULE-0062]
    description: "The direct children (links in the group) of each object with an ME-ASM TraceID overlap by at most 0.001 mm3 (boolean common), per variant (the links' own Configs; two parts in every variant give one finding); parts joined by an assembly joint may touch (0.1 mm3 for numerical noise); the skeleton link and library fasteners (lib/ objects with a Standard property) are left out; other overlaps need an accepted entry (rule overlap, items the two link names) (local, needs FreeCAD)."
  CK-F18:
    need: XD-CHECK-0055
    enforces: [XD-RULE-0062]
    description: "Each board model in an assembly (a link to an object with an EE-PCBA TraceID, e.g. from the board library) sits at a seat LCS (Port = an ME-PORT that specializes a SYS-IF space budget) and stays inside the budget's box (width x depth, -heightBelow to heightAbove in the board frame, the seat's restated values or the budget's defaults; tolerance 0.01 mm); no other part reaches into the box and no library fastener into the board (common volume above 0.001 mm³); fasteners may pass through the box. A skip without a board model. Findings can be accepted (rule space; items the board, or the part or fastener) (local, needs FreeCAD)."
  CK-F19:
    need: XD-CHECK-0056
    enforces: [XD-RULE-0063]
    description: "Every FreeCAD document with a printed part (an object with a PrintProfile property) has exactly one version mark: an LCS with Role = version-emboss (TextSize, MaxWidth), where curatrix cam embosses the assembly version at export (plain Python)."
  CK-F10:
    need: XD-CHECK-0044
    enforces: [XD-RULE-0053]
    description: "The jobset of every pcba/ project: no Execute Command, Copy Files, output folder or job file name outside ${XD_CAM_OUT}, no statistics, ERC or DRC job, BOM delimiters set; every job of the shared template, per variant where the project has variants, equal to the template job except variant and file name; no job without a variant after a variant job."
  CK-F11:
    need: XD-CHECK-0045
    enforces: [XD-RULE-0054]
    description: "The title block of every sheet and of the board has the title ${XD_BOARD} and the Rev ${XD_VERSION}; the board has two silkscreen lines, ${XD_BOARD} and ${XD_VERSION}, and both lines (the version line filled with a long preview version) stay inside the board outline and off its holes and pads (estimated from the font size); the committed values are XD_VERSION = unversioned and XD_BOARD = the project name."
  CK-F12:
    need: XD-CHECK-0049
    enforces: [XD-RULE-0058]
    description: "Every part in the BOM of a pcba/ board, as the base schematic and each variant see it, has the fields Manufacturer and MPN, or a field Standard with its standard designation instead; a variant that changes the value or footprint also overrides the MPN. In an ME repo (task 5.27): every bought part below a top-level assembly (a lib/ object, or one with Manufacturer or MPN) that is not a standard fastener (Standard property) has Manufacturer and MPN, every own part has a Material, and every link points to an object that is there; boards and harnesses are one BOM line and need nothing."
  CK-D9:
    need: XD-CHECK-0050
    enforces: [XD-RULE-0059]
    description: "The plain-Python BOM reader (references, value, footprint, DNP, Manufacturer, MPN, Setting) equals kicad-cli sch export bom of every pcba/ board, without a variant and with --variant for each variant (P5-15)."
  CK-D10:
    need: XD-CHECK-0051
    enforces: [XD-RULE-0060]
    description: "The local curatrix cam output of every pcba/ board exists for the commit the repo is at (with uncommitted changes in the project folder: from exactly that state, by a hash in cam.json), so the board document shows renderings, schematic and ERC/DRC findings; the same for every top-level assembly of an ME repo (mecam.current), so the assembly document shows drawings, exploded view, renderings, mass and findings (task 5.27); never in CI."
  CK-G1:
    need: XD-CHECK-0023
    enforces: [XD-RULE-0038]
    description: "needs-diff against a base: changed needs and the needs affected through links (a report)."
  CK-G2:
    need: XD-CHECK-0024
    enforces: [XD-RULE-0014]
    description: "Suspect links against the needs of the last baseline: a report in the full set, an error at the baseline gate."
  CK-F20:
    need: XD-CHECK-0057
    enforces: [XD-RULE-0064]
    description: "Every file of the board library sits at boards/<board>/<board>-vX.Y.Z[-<variant>].FCStd, carries the board's EE-PCBA ID, version and variant as properties, names an existing release tag on main of the EE repo, pushed (same EE-PCBA in the project at the tag, the tag's commit), is at most 5 MB, and is only ever added (never changed or deleted against the PR base)."
  CK-F21:
    need: XD-CHECK-0058
    enforces: [XD-RULE-0065]
    description: "An ME FreeCAD file that links a board version of the board library gets a note when the library has a newer version of that board and variant, or when the linked file is not in the library."
  CK-H1:
    need: XD-CHECK-0025
    enforces: [XD-RULE-0039]
    description: ".FCStd files and drawio diagrams are stored uncompressed."
  CK-H2:
    need: XD-CHECK-0026
    enforces: [XD-RULE-0040]
    description: "No build output inside the repo."
  CK-H3:
    need: XD-CHECK-0027
    enforces: [XD-RULE-0041]
    description: "Every line of requirements.txt is pinned, and tools.yaml is valid."
  CK-H4:
    need: XD-CHECK-0028
    enforces: [XD-RULE-0042]
    description: "Commits since origin/main carry a Co-Authored-By trailer."
  CK-H5:
    need: XD-CHECK-0029
    enforces: [XD-RULE-0043]
    description: "The repo's copy of scripts/bootstrap.sh equals xdmod/templates/bootstrap.sh."
  CK-H6:
    need: XD-CHECK-0030
    enforces: [XD-RULE-0045]
    description: "The repo's checks.yaml lists in `expect:` exactly the checks it runs (built-in and commands); an expected check that is off, or a running check that is not listed, is an error."
  CK-H7:
    need: XD-CHECK-0031
    enforces: [XD-RULE-0046]
    description: "Counts the hand-written lines and files a PR changes against its base (generated files excluded) and warns above the repo's `pr_size` limits (default 600 lines, 15 files)."
