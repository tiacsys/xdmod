# What `curatrix check xdmod` runs (format: curatrix/README.md, "checks.yaml").
# xdmod's checks: the docs build of the XDMOD manual and the curatrix reference (with the graph
# checks on their needs: decisions, rules, checks), the ledger, hygiene, and the curatrix tests.
version: 1
area: xdmod

docs:                               # CK-A6 strict build of xdmod-manual and xdmod-ref + graph checks
  registry: docs/documents.yaml

ids:
  ledger: ids.yaml
  # Files whose IDs and placeholders are examples or test data, not trace IDs. The decision and
  # rule pages (docs/xdmod-manual/explanation/decisions|rules) and the check catalogue
  # (curatrix/src/curatrix/data/checks.yaml) hold real XD-* IDs and are checked.
  # fnmatch: `*` also matches `/`.
  exclude:
    - "curatrix/*.py"
    - "curatrix/*.mjs"
    - "curatrix/tests/*"
    - "curatrix/limits.yaml"
    - "curatrix/pyproject.toml"
    - "sphinx/*"
    - "launch/*"
    - "templates/*"
    - "needs/*"
    - "sysml/*"
    - "*.md"
    - "claude/*"
    - "workflows/*"
    - ".github/*"
    - "docs/xdmod-manual/tutorials/*"
    - "docs/xdmod-manual/howto/*"
    - "docs/xdmod-manual/reference/*"
    - "docs/xdmod-manual/explanation/[!dr]*"
    - "docs/xdmod-ref/*"

commands:
  - id: XD-T1
    name: curatrix unit tests (pytest; without the tests that need node/Firefox/Java)
    run: ["{python}", "-m", "pytest", "-q", "-m", "not tools", "{repo}/curatrix/tests"]
    use: tests
    stages: [local, pr, full, baseline]
  - id: XD-T2
    name: curatrix tool tests (Pilot, elkjs, headless Firefox)
    run: ["{python}", "-m", "pytest", "-q", "-m", "tools", "{repo}/curatrix/tests"]
    use: tests
    stages: [local, baseline]
    cad: true

# CK-H6: exactly the checks this repo runs (built-in and commands). A section that goes
# missing turns an expected check off, and CK-H6 fails.
expect: [
  CK-A1, CK-A3, CK-A4, CK-A5, CK-A6, CK-B1, CK-B2, CK-B3, CK-B5, CK-B6, CK-C1, CK-C2, CK-G1,
  CK-G2, CK-H1, CK-H2, CK-H3, CK-H4, CK-H6, CK-H7, XD-T1, XD-T2
]
